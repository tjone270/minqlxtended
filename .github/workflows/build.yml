name: minqlxtended build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12"]
        os: ["ubuntu-26.04"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Make
        run: make EXTRA_CFLAGS=-Werror
      - name: Make nopy
        run: make nopy EXTRA_CFLAGS=-Werror
      - name: Make debug
        run: make debug EXTRA_CFLAGS=-Werror
      - name: Make nopy_debug
        run: make nopy_debug EXTRA_CFLAGS=-Werror
      - name: Lint
        run: |
          python3 -m pip install --upgrade ruff
          python3 -m ruff check .
      - name: Type check
        run: |
          python3 -m pip install --upgrade mypy
          python3 -m mypy python/minqlxtended --python-version ${{ matrix.python-version }}
      - name: Generated files are current
        run: |
          python3 tools/gen_stub.py --check
          python3 tools/gen_field_offsets.py --check
      - name: Facts that are written down twice still agree
        run: python3 tools/check_consistency.py --check
